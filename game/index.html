<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA DRIFT</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #050914;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #wrap {
    position: relative;
    line-height: 0;
  }
  canvas {
    display: block;
    width: min(100vw, 160vh);
    height: auto;
    max-height: 100vh;
    background: #050914;
    cursor: crosshair;
    image-rendering: auto;
  }
  #hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -26px;
    text-align: center;
    color: #5f7391;
    font-size: 12px;
    line-height: 1.4;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint">WASD / arrows to fly &middot; mouse to aim &middot; click / Space to fire &middot; P pause &middot; R restart &middot; M mute</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
